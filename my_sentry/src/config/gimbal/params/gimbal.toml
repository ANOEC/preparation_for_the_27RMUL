[default.dual_pid]
P_kp = 0.0                 # 位置环比例系数
P_ki = 0.0                 # 位置环积分系数
P_kd = 0.0                 # 位置环微分系数
P_error_threshold = 0.0    # 位置误差死区，单位 rad
P_integral_limit = 0.0     # 位置环积分项限幅
P_max_output = 0.0         # 位置环最大输出，即速度目标上限，单位 rad/s
V_kp = 0.0                 # 速度环比例系数
V_ki = 0.0                 # 速度环积分系数
V_kd = 0.0                 # 速度环微分系数
V_error_threshold = 0.0    # 速度误差死区，单位 rad/s
V_integral_limit = 0.0     # 速度环积分项限幅
V_max_output = 0.0         # 速度环最大输出，即电机力矩上限，单位 N·m
P_ff = 0.0                 # 位置目标前馈增益

# 线性扩张状态观测器（LESO）的默认参数模板。
[default.leso]
b0 = 1.0                  # 被控对象输入增益估计值
omega = 1.0               # 观测器带宽，越大响应越快但对噪声越敏感

# 线性自抗扰控制器（LADRC）的默认参数模板，目前主控制分支未使用。
[default.ladrc]
b0 = 1.0                  # 被控对象输入增益估计值
w0 = 100.0                # 扩张状态观测器带宽
wc = 20.0                 # 控制器带宽
r = 0.0                   # 跟踪微分器速度因子
output_limit = 0.0        # 控制器输出限幅

# 小 yaw（GM6020）位置环和速度环参数。
[[dual_pid.yaw]]
P_kp = 16.0               # 位置环比例系数
P_max_output = 16384.0    # 位置环输出限幅；当前值基本不限制速度目标
V_kp = 1.08544921875      # 速度环比例系数
V_max_output = 2.223      # 小 yaw 最大输出力矩，单位 N·m

# 大 yaw（DM J4310）位置环和速度环参数。
[[dual_pid.big_yaw]]
P_kp = 10.0               # 位置环比例系数
P_max_output = 16384.0    # 位置环输出限幅；当前值基本不限制速度目标
V_kp = -2.5               # 速度环比例系数；负号用于适配电机安装方向
V_max_output = 9.68625    # 大 yaw 最大输出力矩，单位 N·m

# pitch（DM J4310）位置环和速度环参数。
[[dual_pid.pitch]]
P_kp = 0.0               # 位置环比例系数
P_max_output = 16384.0    # 位置环输出限幅；当前值基本不限制速度目标
V_kp = 1.8                # 速度环比例系数
V_ki = 0.0              # 速度环积分系数，用于消除稳态误差
V_max_output = 9.68625    # pitch 最大输出力矩，单位 N·m
V_integral_limit = 20.0   # pitch 速度环积分项限幅

# 小 yaw 的一阶 LESO 参数，用于估计外部扰动等效力矩。
[[leso.yaw]]
b0 = 49.65                # 小 yaw 输入增益估计值
omega = 100.0             # 小 yaw 观测器带宽

# 大 yaw 的二阶 LESO 参数。
[[leso.big_yaw]]
b0 = 40.0                 # 大 yaw 输入增益估计值
omega = 60.0              # 大 yaw 观测器带宽

# pitch 的一阶 LESO 参数。
[[leso.pitch]]
b0 = 70.0                 # pitch 输入增益估计值
omega = 50.0              # pitch 观测器带宽

# 小 yaw 自动巡逻正弦轨迹，角度参数单位为度。
[[patrol.yaw]]
amplitude = 45.0          # 巡逻摆幅，单位 °
period = 2.0              # 完成一次往复运动的周期，单位 s
offset = 0.0              # 巡逻中心相对零位的偏置，单位 °

# 大 yaw 巡逻时每个控制周期累加的目标角度。
[[patrol.big_yaw]]
add_angle = 0.0055        # 每周期目标角增量，单位 rad；依赖 1 kHz 控制周期

# pitch 常规（低头）巡逻正弦轨迹，角度参数单位为度。
[[patrol.pitch]]
amplitude = 15.0          # 巡逻摆幅，单位 °
period = 1.0              # 完成一次往复运动的周期，单位 s
offset = 10.0             # 巡逻中心相对零位的偏置，单位 °

# pitch 抬头巡逻正弦轨迹，角度参数单位为度。
[[patrol.upper_pitch]]
amplitude = 7.5           # 巡逻摆幅，单位 °
period = 1.0              # 完成一次往复运动的周期，单位 s
offset = -22.5            # 巡逻中心相对零位的偏置，单位 °

# 速度环正弦跟随测试。测试仍受遥控器使能和反馈超时保护。
# axis: 0=小 yaw (GM6020), 1=大 yaw (DM J4310), 2=pitch (DM J4310)。
[velocity_test]
enabled = true
axis = 2
frequency_hz = 0.5
amplitude_rad_per_sec = 1.5
offset_rad_per_sec = 0.0
telemetry_period_ms = 10

# 云台 IMU 安装和校准参数。
[[imu]]
horizontal_shift = 90.0       # IMU 坐标系相对云台坐标系的水平旋转角，单位 °
fix_by_encoder_flag = true    # 是否使用电机编码器辅助修正 IMU 姿态
fix_by_encoder_time = 1.0     # 上电后执行编码器辅助修正的持续时间，单位 s
constant_temperature = 50.0  # IMU 恒温控制目标温度，单位 ℃
variable = "n"               # 生成 constexpr 参数，运行时不可修改

# 云台控制、动力学与补偿参数。
[param]
yaw_feedforward = 0.0          # 小 yaw 控制输出前馈系数
big_yaw_feedforward = 0.0      # 大 yaw 控制输出前馈系数

# pitch 重力补偿模型：Tg = w1·sin(pitch) + w2·cos(pitch) + w3。
gravity_w1 = 0.2825          # 正弦项系数，单位 N·m
gravity_w2 = -0.0982           # 余弦项系数，单位 N·m
gravity_w3 = -0.2219           # 常量偏置，单位 N·m

pitch_J = 0.0084               # pitch 轴等效转动惯量，单位 kg·m²
# pitch_J = 0.018864           # 另一组曾使用的 pitch 惯量标定值

# 小 yaw 等效转动惯量随 pitch 姿态变化的拟合系数和下限。
yaw_J_w1 = 0.6460679           # 惯量拟合系数 1
yaw_J_w2 = -1.1799474          # 惯量拟合系数 2
yaw_J_w3 = 0.5565527           # 惯量拟合系数 3
yaw_J_min = 0.018              # 小 yaw 等效惯量下限，单位 kg·m²

yaw_avg_J = 0.012              # 小 yaw 平均等效转动惯量，单位 kg·m²
# yaw_avg_J = 0.0201404        # 另一组曾使用的小 yaw 平均惯量

# 大 yaw 等效转动惯量随 pitch 姿态变化的拟合系数和下限。
big_yaw_J_w1 = -0.0643486      # 惯量拟合系数 1
big_yaw_J_w2 = 0.0366733       # 惯量拟合系数 2
big_yaw_J_w3 = 0.1073112       # 惯量拟合系数 3
big_yaw_J_min = 0.078          # 大 yaw 等效惯量下限，单位 kg·m²

big_yaw_avg_J = 0.03           # 大 yaw 平均等效转动惯量，单位 kg·m²
# big_yaw_avg_J = 0.08382114   # 另一组曾使用的大 yaw 平均惯量

chassis_lbg_bandwidth = 23.0   # 底盘侧低带宽增益/观测器带宽参数
gimbal_lbg_bandwidth = 30.0    # 云台侧低带宽增益/观测器带宽参数

forward_compensation_yaw = 0.0       # 小 yaw 控制前向补偿系数
forward_compensation_big_yaw = 0.0   # 大 yaw 控制前向补偿系数
yaw_ramp_rate = 0.025                # yaw 目标斜坡每周期最大增量，单位 rad
big_yaw_chassis_compensation = 0.22  # 底盘角速度到大 yaw 力矩的补偿系数
pitch_limit_lpf_alpha = 0.2          # pitch 自适应限位差值低通系数，范围通常为 0~1

# 目标轨迹外推和手动目标整形使用的最大角速度。
yaw_max_vel = 13.0            # yaw 最大目标角速度，单位 rad/s
pitch_max_vel = 4.2           # pitch 最大目标角速度，单位 rad/s
